name: Phase 7 golden path
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: phase10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-golden-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned development environment
        run: |
          python -m pip install uv==0.13.1
          uv sync --locked
          npm install --global pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Start isolated local simulator stack
        run: python tools/dev.py start
      - name: Run the full Phase 7 gate
        run: uv run --locked python tools/dev.py check
      - name: Collect non-secret test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase10-test-results
          path: |
            test-results/e2e-results.json
            docs/results/phase10-dashboard.png
            docs/results/phase10-memory-panel.png
            docs/results/phase10-mobile.png
            docs/results/phase10-restart-replay.png
            docs/results/phase10-manual-evidence.png
            docs/results/phase10-manual-mobile.png
          if-no-files-found: ignore
      - name: Stop containers, preserve no credentials in artifacts
        if: always()
        run: python tools/dev.py stop
