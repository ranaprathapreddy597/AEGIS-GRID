    <rect width="330" height="38" rx="10" fill="#182338"/>
    <text x="20" y="25" fill="#00E5FF" font-size="14" font-weight="bold" letter-spacing="1">1. LOCAL FACTORY &amp; EDGE</text>

    <!-- Box 1A: C++ Digital Twin -->
