  <text x="1240" y="35" fill="#00E5FF" font-size="12" font-weight="bold" letter-spacing="0.5">TRACK 1: INTELLIGENT INDUSTRY</text>

  <!-- COLUMN 1: Physical Digital Twin & Local Edge -->
  <g transform="translate(40, 90)">
