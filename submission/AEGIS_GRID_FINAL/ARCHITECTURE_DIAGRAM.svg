    <rect width="280" height="38" rx="10" fill="#12241a"/>
    <text x="20" y="25" fill="#00E676" font-size="14" font-weight="bold" letter-spacing="1">4. EXECUTION &amp; AUDIT</text>

    <!-- Box 4A: Independent Execution Gateway -->
