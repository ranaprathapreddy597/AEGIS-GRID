pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server {
    listen 8080;
    server_name localhost 127.0.0.1;
    root /usr/share/nginx/html;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /healthz { default_type application/json; return 200 '{"status":"ok","service":"web"}'; }
    location = /api/v1/edge/events {
      client_max_body_size 1m;
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
    location /api/ {
      proxy_pass http://api:8000;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 240s;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }
    location /internal/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
